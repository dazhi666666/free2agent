# free2agent bundle 补丁：向组合树注册 llm-chat-text 插件。
# 相对 name 相对本文件（bundle 安装后即包目录）解析，插件源码随包分发。
# 装好后改模型：在你自己 profile 的 cordis.patch.yml 里用
#   - id: llm-chat-text
#     config: { providers: {...} }
# 覆盖本条（补丁语义 = 整份 config 替换），或直接在 dsh 模型选择器里选。
- insert:
    - id: llm-chat-text
      name: './plugin/src/index.ts'
      config:
        providers:
          # 出厂示例路由：按需替换成你的免费来源（DeepSeek-Free-API / Chat2API 桥接、
          # OpenRouter :free、本地 Ollama……见 README）
          chat-text:
            displayName: 对话模型
            baseURL: https://api.deepseek.com/v1
            apiKeyEnv: DEEPSEEK_API_KEY
            contextWindow: 128000
            models:
              - id: deepseek-chat
                name: DeepSeek Chat
              - id: deepseek-reasoner
                name: DeepSeek Reasoner
